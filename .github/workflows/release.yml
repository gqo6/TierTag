name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Gradle daemon runtime)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --console=plain --stacktrace -x test

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v ver="v${GITHUB_REF_NAME}" '
            $0 ~ ("^## " ver) { flag=1; next }
            /^## v/ && flag { exit }
            flag { sub(/\r$/, ""); print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "> ما انضاف قسم CHANGELOG لهذا الإصدار — راجع سجل التغييرات أو سجل الكوميت" > release_notes.md
          fi

      - name: Publish GitHub Release with the built jar
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          body_path: release_notes.md
