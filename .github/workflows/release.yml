name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Gradle daemon runtime)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --console=plain --stacktrace -x test

      - name: Extract release notes from CHANGELOG.md
        run: |
          python3 .github/changelog_extract.py > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "> No CHANGELOG section for this release - see the commit log or CHANGELOG.md." > release_notes.md
          fi

      - name: Publish GitHub Release with the built jar
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          body_path: release_notes.md
